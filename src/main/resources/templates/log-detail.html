<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            font-size: 20px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 56px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background: #fff;
            border: 1px solid #d9d9d9;
            border-radius: 12px;
            color: #666;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s;
            margin-bottom: 32px;
        }
        .back-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }
        .detail-card {
            background: #fff;
            border-radius: 18px;
            padding: 48px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 32px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            padding-bottom: 28px;
            border-bottom: 1px solid #f0f0f0;
        }
        .page-header h1 {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .status-tag {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 18px;
            font-size: 19px;
            font-weight: 600;
        }
        .status-tag.success {
            background: #e6fffb;
            color: #11998e;
        }
        .status-tag.error {
            background: #fff2f0;
            color: #eb3349;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 28px;
            align-items: start;
        }
        .info-label {
            color: #8c8c8c;
            font-size: 19px;
            font-weight: 500;
            padding-top: 8px;
        }
        .info-value {
            color: #333;
            font-size: 20px;
            word-break: break-all;
            line-height: 1.8;
        }
        .info-value.code {
            background: #f6f8fa;
            padding: 24px 28px;
            border-radius: 14px;
            font-family: 'SF Mono', Consolas, Monaco, monospace;
            font-size: 18px;
            line-height: 1.9;
            white-space: pre-wrap;
            max-height: 360px;
            overflow-y: auto;
        }
        .info-value.error-msg {
            background: #fff2f0;
            color: #eb3349;
            padding: 24px 28px;
            border-radius: 14px;
            font-family: 'SF Mono', Consolas, Monaco, monospace;
            font-size: 18px;
            line-height: 1.9;
        }
        .info-value.slow-cost {
            color: #eb3349;
            font-weight: 700;
            font-size: 26px;
        }
        .info-value.fast-cost {
            color: #11998e;
            font-weight: 600;
            font-size: 20px;
        }
        .info-value.normal-cost {
            font-weight: 500;
            font-size: 20px;
        }

        .divider {
            grid-column: 1 / -1;
            height: 1px;
            background: #f0f0f0;
            margin: 14px 0;
        }

        .ai-section {
            background: #fff;
            border-radius: 18px;
            padding: 48px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .ai-title {
            font-size: 30px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .ai-title::before {
            content: '🤖';
            margin-right: 14px;
        }
        .ai-btn {
            padding: 16px 36px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .ai-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .ai-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: none;
            align-items: center;
            gap: 14px;
            color: #10b981;
            font-size: 19px;
            font-weight: 500;
        }
        .loading.active {
            display: inline-flex;
        }
        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e8e8e8;
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .ai-result {
            display: none;
            margin-top: 32px;
            padding: 32px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            border-radius: 18px;
            border-left: 7px solid #10b981;
        }
        .ai-result.show {
            display: block;
        }
        .ai-result-title {
            font-size: 20px;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 20px;
        }
        .ai-content {
            white-space: pre-wrap;
            font-family: 'SF Mono', Consolas, Monaco, monospace;
            font-size: 19px;
            line-height: 2.1;
            color: #333;
        }
        .slow-badge {
            display: inline-block;
            padding: 6px 16px;
            background: #fff2f0;
            color: #eb3349;
            border-radius: 16px;
            font-size: 18px;
            margin-left: 14px;
            font-weight: 600;
        }
        .env-tag {
            display: inline-block;
            padding: 6px 16px;
            background: #e6f7ff;
            color: #1890ff;
            border-radius: 10px;
            font-size: 18px;
            margin-left: 14px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .info-label {
                padding-bottom: 0;
            }
            .container { padding: 20px; }
            .detail-card, .ai-section { padding: 28px; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="/logs" class="back-btn">← 返回列表</a>

    <div class="detail-card">
        <div class="page-header">
            <h1>接口日志详情</h1>
            <span th:if="${log.status == 'SUCCESS'}" class="status-tag success">✅ 成功</span>
            <span th:unless="${log.status == 'SUCCESS'}" class="status-tag error">❌ 失败</span>
        </div>

        <div class="info-grid">
            <div class="info-label">ID</div>
            <div class="info-value" th:text="${log.id}">-</div>

            <div class="info-label">Trace ID</div>
            <div class="info-value" th:text="${log.traceId}">-</div>

            <div class="info-label">接口名称</div>
            <div class="info-value" th:text="${log.interfaceName}">-</div>

            <div class="info-label">方法名</div>
            <div class="info-value" th:text="${log.method}">-</div>

            <div class="info-label">请求参数</div>
            <div class="info-value code" th:text="${log.requestParams}">无</div>

            <div class="info-label">返回数据</div>
            <div class="info-value code" th:text="${log.responseData}">无</div>

            <div class="info-label">耗时</div>
            <div class="info-value">
                <span th:if="${log.costLevel == 'slow'}" class="slow-cost" th:text="${log.costTime}">0</span>
                <span th:elif="${log.costLevel == 'fast'}" class="fast-cost" th:text="${log.costTime}">0</span>
                <span th:else class="normal-cost" th:text="${log.costTime}">0</span>
                <span> ms</span>
                <span th:if="${log.slow}" class="slow-badge">🐢 慢接口</span>
            </div>

            <div class="info-label">状态</div>
            <div class="info-value">
                <span th:if="${log.status == 'SUCCESS'}" class="status-tag success">成功</span>
                <span th:unless="${log.status == 'SUCCESS'}" class="status-tag error">失败</span>
            </div>

            <div class="info-label" th:if="${log.errorMsg != null and log.errorMsg != ''}">错误信息</div>
            <div class="info-value error-msg" th:if="${log.errorMsg != null and log.errorMsg != ''}" th:text="${log.errorMsg}">-</div>

            <div class="info-label">调用方IP</div>
            <div class="info-value" th:text="${log.callerIp}">-</div>

            <div class="info-label">时间</div>
            <div class="info-value" th:text="${log.formattedCreateTime}">-</div>

            <div class="info-label" th:if="${log.env != null}">环境</div>
            <div class="info-value" th:if="${log.env != null}">
                <span class="env-tag" th:text="${log.env}">dev</span>
            </div>
        </div>
    </div>

    <div class="ai-section" th:if="${log.errorMsg != null and log.errorMsg != ''}">
        <div class="ai-header">
            <div class="ai-title">AI 智能分析</div>
            <div>
                <span class="loading" id="loadingHint">
                    <span class="loading-spinner"></span>
                    <span>AI 分析中，请稍候...</span>
                </span>
                <button id="aiAnalyzeBtn" class="ai-btn">开始分析</button>
            </div>
        </div>

        <div class="ai-result" id="aiResult">
            <div class="ai-result-title">🤖 AI 分析结果</div>
            <div class="ai-content" id="aiContent"></div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    (function() {
        const logId = /*[[${log.id}]]*/ 0;
        const analyzeBtn = document.getElementById('aiAnalyzeBtn');
        const loadingHint = document.getElementById('loadingHint');
        const resultDiv = document.getElementById('aiResult');
        const contentDiv = document.getElementById('aiContent');

        analyzeBtn.addEventListener('click', function() {
            analyzeBtn.disabled = true;
            loadingHint.classList.add('active');
            resultDiv.classList.remove('show');

            fetch('/logs/analyze/' + logId)
                .then(response => response.json())
                .then(data => {
                    loadingHint.classList.remove('active');
                    analyzeBtn.disabled = false;
                    resultDiv.classList.add('show');
                    if (data.error) {
                        contentDiv.textContent = '❌ ' + data.error;
                    } else {
                        contentDiv.textContent = data.analysis;
                    }
                })
                .catch(error => {
                    loadingHint.classList.remove('active');
                    analyzeBtn.disabled = false;
                    resultDiv.classList.add('show');
                    contentDiv.textContent = '请求失败，请重试。错误：' + error.message;
                });
        });
    })();
</script>

</body>
</html>
